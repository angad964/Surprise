<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine? ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
      overflow: hidden;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      max-width: 500px;
    }

    button {
      margin: 10px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      background: #ff2f68;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #noBtn {
      transition: left 0.25s ease, top 0.25s ease;
    }

    .hidden { display: none !important; }

    #gameArea {
      position: relative;
      width: 100%;
      height: 60vh;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 2.5rem;
      cursor: pointer;
      animation: float 6s linear forwards;
      user-select: none;
    }

    @keyframes float {
      from { bottom: -60px; opacity: 1; }
      to   { bottom: 110%; opacity: 0; transform: rotate(360deg); }
    }

    /* YES burst hearts */
    .burst-heart {
      position: absolute;
      width: 24px;
      height: 24px;
      background: #ff4d94;
      transform: rotate(-45deg);
      opacity: 0;
      pointer-events: none;
      border-radius: 4px;
    }

    .burst-heart::before,
    .burst-heart::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      background: inherit;
      border-radius: 50%;
    }

    .burst-heart::before { top: -12px; }
    .burst-heart::after { left: 12px; }

    @keyframes burst {
      0%   { transform: scale(0.4) rotate(-45deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(-45deg); opacity: 0; }
    }

    /* Falling hearts */
    #falling-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .falling-heart {
      position: absolute;
      font-size: 2rem;
      animation: fall linear forwards;
    }

    @keyframes fall {
      from { transform: translateY(-10vh); }
      to { transform: translateY(120vh) rotate(720deg); }
    }
  </style>
</head>

<body>

  <div id="falling-container"></div>

  <!-- Intro -->
  <div id="intro" class="screen">
    <h1>Hey ❤️</h1>
    <p>I made a tiny game just for you. Win it, and I have a question 👀</p>
    <button onclick="startGame()">Start the Game</button>
  </div>

  <!-- Game -->
  <div id="game" class="screen hidden">
    <h1>Catch the Hearts 💕</h1>
    <p>Score: <span id="score">0</span>/5</p>
    <div id="gameArea"></div>
  </div>

  <!-- Question -->
  <div id="question" class="screen hidden">
    <h1>So… 💖</h1>
    <p>Will you be my Valentine? 🌹</p>
    <button onclick="yesAnswer(event)">YES 😍</button>
    <button id="noBtn">NO 🙄</button>
  </div>

  <!-- Result -->
  <div id="result" class="screen hidden">
    <h1 id="resultText"></h1>
    <p>You just made my day, thank you soo muchhh babee! Happy Monthsary!❤️</p>
  </div>

  <audio id="bgMusic" loop>
    <source src="bgmusic.mp3" type="audio/mpeg">
  </audio>

  <script>
    let score = 0;
    let gameInterval;
    const TARGET_SCORE = 5;

    function startGame() {
      intro.classList.add('hidden');
      game.classList.remove('hidden');
      gameInterval = setInterval(spawnHeart, 800);
      bgMusic.volume = 0.4;
      bgMusic.play().catch(() => {});
    }

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = '❤️';
      heart.style.left = Math.random() * 90 + '%';
      gameArea.appendChild(heart);

      heart.onclick = () => {
        score++;
        scoreEl.innerText = score;
        heart.remove();
        if (score >= TARGET_SCORE) endGame();
      };

      setTimeout(() => heart.remove(), 6000);
    }

    function endGame() {
      clearInterval(gameInterval);
      game.classList.add('hidden');
      question.classList.remove('hidden');
    }

    function yesAnswer(e) {
      question.classList.add('hidden');
      result.classList.remove('hidden');
      resultText.innerText = 'YAY!! 💘🥰';
      startFallingHearts();
    }

    function startFallingHearts() {
      setInterval(() => {
        const h = document.createElement('div');
        h.className = 'falling-heart';
        h.innerText = '💖';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.animationDuration = (8 + Math.random() * 6) + 's';
        falling-container.appendChild(h);
        setTimeout(() => h.remove(), 15000);
      }, 600);
    }

    // NO button escape logic
    const noBtn = document.getElementById('noBtn');

    function moveNoButton() {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      noBtn.style.position = 'fixed';
      noBtn.style.left = Math.random() * maxX + 'px';
      noBtn.style.top = Math.random() * maxY + 'px';
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('gameArea');
    const intro = document.getElementById('intro');
    const game = document.getElementById('game');
    const question = document.getElementById('question');
    const result = document.getElementById('result');
    const resultText = document.getElementById('resultText');
    const bgMusic = document.getElementById('bgMusic');
  </script>

</body>
</html>
